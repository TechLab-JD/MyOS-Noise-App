<div class="app-window" id="NoiseApp">
  <div class="app-header"><span class="app-title">🌊 Focus Sounds</span><div class="app-controls"><button class="minimize-btn">–</button><button class="close-btn">×</button></div></div>
  <div class="app-content">
    <div class="ns">
      <div class="ns-types">
        <button data-t="white" class="on">White</button>
        <button data-t="pink">Pink</button>
        <button data-t="brown">Brown</button>
      </div>
      <button id="ns-toggle" class="ns-toggle">▶ Play</button>
      <label class="ns-vol">Volume <input id="ns-vol" type="range" min="0" max="100" value="40"></label>
      <p class="ns-note">Looping generated noise — great for focus or masking background sound.</p>
    </div>
  </div>
  <div class="resize-handle"></div>
</div>
